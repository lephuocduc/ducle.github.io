<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bgGradient" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#B22222" />
      <stop offset="55%" stop-color="#8B0000" />
      <stop offset="100%" stop-color="#580000" />
    </radialGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4E5B8" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#A88622" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#380000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Nền tròn đỏ mận -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGradient)" />

  <!-- Viền vàng champagne -->
  <circle cx="50" cy="50" r="45.5" fill="none" stroke="url(#goldGradient)" stroke-width="3" />

  <!-- Ký tự Song Hỷ 囍 -->
  <text x="50" y="58" text-anchor="middle" font-family="'Noto Serif SC','PingFang SC','Microsoft YaHei',serif"
        font-size="52" font-weight="700" fill="url(#goldGradient)" filter="url(#softShadow)">囍</text>

  <!-- Trái tim nhỏ điểm nhấn phía dưới -->
  <path fill="url(#goldGradient)" opacity="0.95"
        d="M50 87 C 45 83.5 41.5 80.7 41.5 77.3 C 41.5 75 43.3 73.2 45.6 73.2 C 47 73.2 48.3 73.9 49 75 C 49.4 75.6 49.7 76 50 76.5 C 50.3 76 50.6 75.6 51 75 C 51.7 73.9 53 73.2 54.4 73.2 C 56.7 73.2 58.5 75 58.5 77.3 C 58.5 80.7 55 83.5 50 87 Z" />
</svg>
